description = "Search the project's episodic memory for earlier observations"
prompt = """
Search the project's episodic memory (.agents/memory/episodes.jsonl) for the
observations recorded in earlier sessions — decisions, discoveries, changes and
gotchas.

Use the claude-mem skill (.agents/skills/automation/claude-mem/SKILL.md) for the
exact CLI. Types, concepts and tags are hard filters and free text is scored
with an IDF model, so a sharp query beats a vague one.

1. Search for the topic the user asked about.
2. Summarize what earlier sessions decided, quoting the titles of the matched
   episodes.
3. Say so plainly if nothing matched — do not invent history.
"""
