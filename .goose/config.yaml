# Goose CLI Configuration (Project-Scoped)
version: 1.0.0
instructions: AGENTS.md

# --- MCP extensions --------------------------------------------------------
# graphify is the only always-on server (the "core" profile).
extensions:
  graphify:
    name: graphify
    cmd: uvx
    args:
      - "--from"
      - "graphifyy"
      - "graphify-mcp"
    enabled: true
    envs:
      UV_CACHE_DIR: ".cache/uv"
      UV_DATA_DIR: ".cache/uv-data"
      UV_TOOL_DIR: ".cache/uv-tools"
      XDG_CACHE_HOME: ".cache"
      XDG_DATA_HOME: ".cache/xdg-data"
      npm_config_cache: ".cache/npm"
    type: stdio
  ui-registry:
    name: ui-registry
    cmd: npx
    args:
      - "-y"
      - "ui-registry-mcp@0.7.1"
    enabled: false
    envs:
      UV_CACHE_DIR: ".cache/uv"
      UV_DATA_DIR: ".cache/uv-data"
      UV_TOOL_DIR: ".cache/uv-tools"
      XDG_CACHE_HOME: ".cache"
      XDG_DATA_HOME: ".cache/xdg-data"
      npm_config_cache: ".cache/npm"
    type: stdio
  headroom:
    name: headroom
    cmd: uvx
    args:
      - "--from"
      - "headroom-ai[mcp]"
      - "headroom"
      - "mcp"
      - "serve"
    enabled: false
    envs:
      UV_CACHE_DIR: ".cache/uv"
      UV_DATA_DIR: ".cache/uv-data"
      UV_TOOL_DIR: ".cache/uv-tools"
      XDG_CACHE_HOME: ".cache"
      XDG_DATA_HOME: ".cache/xdg-data"
      npm_config_cache: ".cache/npm"
    type: stdio
