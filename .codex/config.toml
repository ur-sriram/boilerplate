# Codex CLI Project Configuration
# Scoped strictly to project level; zero global side-effects.
#
# Codex reads AGENTS.md and .agents/skills/ natively, so no rule or skill
# indirection is needed here. The previous `rules_file` and
# `[project].skills_directory` keys were not part of Codex's configuration
# reference and were silently ignored; they have been removed.

# --- MCP servers -----------------------------------------------------------
# Only graphify is enabled by default (the "core" profile, <= 350 tokens).
# ui-registry and headroom belong to the ui / compression profiles and are
# toggled by scripts/mcp-profile.sh.

[mcp_servers.graphify]
command = "uvx"
args = ["--from", "graphifyy[mcp]", "graphify-mcp"]
env = { "UV_CACHE_DIR" = ".cache/uv", "UV_DATA_DIR" = ".cache/uv-data", "UV_TOOL_DIR" = ".cache/uv-tools", "XDG_CACHE_HOME" = ".cache", "XDG_DATA_HOME" = ".cache/xdg-data", "npm_config_cache" = ".cache/npm" }
enabled = true
[mcp_servers.ui-registry]
command = "npx"
args = ["-y", "ui-registry-mcp@0.7.1"]
env = { "UV_CACHE_DIR" = ".cache/uv", "UV_DATA_DIR" = ".cache/uv-data", "UV_TOOL_DIR" = ".cache/uv-tools", "XDG_CACHE_HOME" = ".cache", "XDG_DATA_HOME" = ".cache/xdg-data", "npm_config_cache" = ".cache/npm" }
enabled = false
[mcp_servers.headroom]
command = "uvx"
args = ["--from", "headroom-ai[mcp]", "headroom", "mcp", "serve"]
env = { "UV_CACHE_DIR" = ".cache/uv", "UV_DATA_DIR" = ".cache/uv-data", "UV_TOOL_DIR" = ".cache/uv-tools", "XDG_CACHE_HOME" = ".cache", "XDG_DATA_HOME" = ".cache/xdg-data", "npm_config_cache" = ".cache/npm" }
enabled = false

# --- Lifecycle hooks -------------------------------------------------------
# Codex expects hooks.<Event> to be an ARRAY OF MATCHER GROUPS, each with its
# own `hooks` list of {type, command} objects. The previous flat string keys
# (pre_tool_use = "...") matched no schema and never fired.
#
# run-hook.mjs is a Node.js dispatcher, so the same command string works on
# Windows, macOS and Linux (the previous powershell-only entries silently
# no-op'd on POSIX).

[[hooks.PreToolUse]]
matcher = "Write|Edit|MultiEdit"
hooks = [{ type = "command", command = "node ./scripts/hooks/run-hook.mjs protect-config" }]

[[hooks.PostToolUse]]
matcher = "Bash"
hooks = [{ type = "command", command = "node ./scripts/hooks/run-hook.mjs rtk-filter" }]

[[hooks.SessionStart]]
hooks = [{ type = "command", command = "node ./scripts/hooks/run-hook.mjs session-start" }]

# Recall the project's cross-session episodic memory (claude-mem). Advisory:
# a missing store never fails the session.
[[hooks.SessionStart]]
hooks = [{ type = "command", command = "node ./scripts/hooks/run-hook.mjs memory-sync" }]
